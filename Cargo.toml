[workspace]
resolver = "3"
members = ["crates/*"]
# Extensions are guest WebAssembly components. They target wasm32-wasip2 and are
# built by the `nebula-sdk` CLI against the published WIT world, never as part of
# the host workspace — a guest must not be able to link the host's crates.
exclude = ["extensions"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Nebula-Proprietary"
authors = ["Nebula IDE"]
repository = "https://github.com/muthu2201/Nebula-ide-"
homepage = "https://github.com/muthu2201/Nebula-ide-"

[workspace.dependencies]
# --- internal ---
nebula-core = { path = "crates/nebula-core", version = "0.1.0" }
nebula-vfs = { path = "crates/nebula-vfs", version = "0.1.0" }
nebula-syntax = { path = "crates/nebula-syntax", version = "0.1.0" }
nebula-search = { path = "crates/nebula-search", version = "0.1.0" }
nebula-index = { path = "crates/nebula-index", version = "0.1.0" }
nebula-vector = { path = "crates/nebula-vector", version = "0.1.0" }
nebula-render = { path = "crates/nebula-render", version = "0.1.0" }
nebula-lsp = { path = "crates/nebula-lsp", version = "0.1.0" }
nebula-mcp = { path = "crates/nebula-mcp", version = "0.1.0" }
nebula-ai = { path = "crates/nebula-ai", version = "0.1.0" }
nebula-sandbox = { path = "crates/nebula-sandbox", version = "0.1.0" }
nebula-exec = { path = "crates/nebula-exec", version = "0.1.0" }
nebula-wasm-host = { path = "crates/nebula-wasm-host", version = "0.1.0" }
nebula-pkg = { path = "crates/nebula-pkg", version = "0.1.0" }
nebula-license = { path = "crates/nebula-license", version = "0.1.0" }
nebula-update = { path = "crates/nebula-update", version = "0.1.0" }
nebula-agent = { path = "crates/nebula-agent", version = "0.1.0" }
nebula-ui = { path = "crates/nebula-ui", version = "0.1.0" }
nebula-ide = { path = "crates/nebula-ide", version = "0.1.0", default-features = false }
nebula-stress = { path = "crates/nebula-stress", version = "0.1.0" }

# --- text / core ---
ropey = "1.6"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
memchr = "2.7"
unicode-segmentation = "1.12"
unicode-width = "0.2"

# --- async / runtime ---
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.11"

# --- serialization ---
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
toml = "0.9"
serde_yaml_ng = "0.10"
bincode = { version = "2.0", features = ["serde"] }

# --- error handling / logging ---
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"

# --- fs / process ---
notify = "8.2"
notify-debouncer-full = "0.6"
ignore = "0.4"
walkdir = "2.5"
memmap2 = "0.9"
dirs = "6.0"
tempfile = "3.24"
which = "8.0"

# --- search ---
regex = "1.11"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
aho-corasick = "1.1"
nucleo-matcher = "0.3"

# --- syntax ---
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"

# --- graphics ---
wgpu = "30.0"
winit = "0.30"
cosmic-text = "0.19"
tiny-skia = "0.12"
raw-window-handle = "0.6"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
etagere = "0.2"

# --- net / http ---
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "rustls-native-certs",
    "charset",
    "http2",
] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "cors"] }
hyper = "1.8"
url = "2.5"
eventsource-stream = "0.2"
http = "1.4"

# --- crypto ---
ed25519-dalek = { version = "3.0", features = ["rand_core", "pkcs8", "pem"] }
sha2 = "0.10"
blake3 = "1.8"
hmac = "0.12"
rand = "0.9"
rand_core = "0.9"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1.8", features = ["derive"] }
zstd = "0.13"

# --- wasm ---
wasmtime = { version = "47.0", features = ["component-model", "async", "cranelift"] }
wasmtime-wasi = "47.0"
wasm-encoder = "0.246"
wasmparser = "0.246"
wit-parser = "0.246"
wit-component = "0.246"

# --- platform sandboxing ---
landlock = "0.4"
seccompiler = "0.5"
nix = { version = "0.31", features = ["process", "signal", "resource", "user", "fs"] }
libc = "0.2"
windows-sys = "0.61"

# --- secrets ---
# The keychain backend is chosen per target in `nebula-ai`, so that a Linux
# build does not compile the macOS and Windows stores (and vice versa).
keyring = { version = "4.1", default-features = false, features = ["v1"] }

# --- cli / misc ---
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
indicatif = "0.18"
console = "0.16"
uuid = { version = "1.19", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
humantime = "2.3"
semver = { version = "1.0", features = ["serde"] }
sysinfo = "0.38"
tar = "0.4"
flate2 = "1.1"
num_cpus = "1.17"

# --- dev / test ---
criterion = { version = "0.7", features = ["html_reports"] }
proptest = "1.9"
insta = { version = "1.44", features = ["json"] }
pretty_assertions = "1.4"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

# Release profile that keeps unwinding, for anything that needs to catch panics
# (the WASM host traps guests without aborting the process) and for benches.
[profile.release-unwind]
inherits = "release"
panic = "unwind"

[profile.bench]
inherits = "release-unwind"
debug = 1
strip = "none"

# Fast, fully-optimised profile used by the stress harness in CI.
[profile.stress]
inherits = "release-unwind"
lto = "thin"
codegen-units = 4
