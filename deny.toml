# Dependency policy, enforced by `cargo deny` in CI.
#
# The point of each section is stated where it is not obvious. A policy file
# whose rules nobody can explain is a policy file that gets `--allow`ed away the
# first time it fails.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `ttf-parser` is unmaintained with no safe upgrade. It reaches us only
    # transitively — through cosmic-text/fontdb for shaping, and through
    # winit/sctk-adwaita for window decorations — so there is nothing here to
    # migrate. It is a parsing crate with no known vulnerability; the advisory
    # is a maintenance notice. Revisit when cosmic-text moves to `skrifa`.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
# Permissive licences only. A copyleft dependency in a proprietary editor is a
# licensing problem discovered at the worst possible moment.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Mozilla's CA certificate data, as shipped by webpki-root-certs. A
    # permissive data licence, not a code licence.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Nebula's own crates carry `LicenseRef-Nebula-Proprietary`, which is not an
# SPDX identifier and never will be. They are all `publish = false`, so this
# skips them rather than requiring a fictitious licence in the allow list.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `highlight` shows why a duplicate exists rather than only that it does.
highlight = "all"
deny = [
    # A build that silently shells out to OpenSSL is a build that fails on a
    # machine without it. Everything here uses rustls.
    { name = "openssl-sys" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
