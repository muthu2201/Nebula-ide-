# Dependency policy, enforced by `cargo deny` in CI.
#
# The point of each section is stated where it is not obvious. A policy file
# whose rules nobody can explain is a policy file that gets `--allow`ed away the
# first time it fails.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licences only. A copyleft dependency in a proprietary editor is a
# licensing problem discovered at the worst possible moment.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.exceptions]]
# The bundled font. Bitstream Vera's licence is permissive and allows
# redistribution; it is simply not an SPDX identifier cargo-deny knows.
name = "nebula-render"
allow = ["MIT"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `highlight` shows why a duplicate exists rather than only that it does.
highlight = "all"
deny = [
    # A build that silently shells out to OpenSSL is a build that fails on a
    # machine without it. Everything here uses rustls.
    { name = "openssl-sys" },
    { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
