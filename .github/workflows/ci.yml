# Everything that has to be true before a change lands.
#
# The jobs are split so a failure names its own cause: a formatting job that
# also runs the tests tells you "CI failed" and nothing more.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # A warning that nobody sees is a warning that never gets fixed.
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install the Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev pkg-config \
            mesa-vulkan-drivers vulkan-tools

      - name: Check that Landlock is available
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # GitHub's Ubuntu 24.04 runners are on kernel 6.x, so the sandbox
          # tests must actually enforce here rather than skipping. Without this
          # gate a kernel regression would silently turn the whole sandbox suite
          # into no-ops.
          test -e /sys/kernel/security/lsm && cat /sys/kernel/security/lsm || true
          echo "NEBULA_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"

      - name: Use the software Vulkan driver
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # lavapipe gives the GPU backend a real adapter on a headless
          # runner, so the wgpu path is exercised rather than skipped.
          #
          # Whether that worked is checked rather than assumed. The previous
          # attempt exported NEBULA_REQUIRE_GPU whenever an ICD file was
          # present, which is a proxy for "an adapter exists" and not the same
          # thing — the arm runner had no matching ICD at all, and the flag
          # turned nine legitimate skips into failures. Ask Vulkan instead.
          icd="/usr/share/vulkan/icd.d/lvp_icd.$(uname -m).json"
          if [ -f "$icd" ]; then
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
            export VK_ICD_FILENAMES="$icd"
          fi
          if vulkaninfo --summary 2>/dev/null | grep -q "deviceName"; then
            echo "NEBULA_REQUIRE_GPU=1" >> "$GITHUB_ENV"
            echo "a Vulkan device is present; the GPU tests must run"
          else
            echo "no Vulkan device; the GPU tests will skip"
          fi

      - name: Run the test suite
        env:
          # Every failure so far has been fully described by its panic message
          # and made unreadable by the ~29 tokio frames printed underneath it.
          #
          # This was macOS and Windows only, on the reasoning that a Linux
          # failure can be reproduced and stepped through locally. Then an
          # intermittent one arrived on `ubuntu-24.04-arm` — no arm machine
          # here, and not reproducible on demand anywhere — and its message,
          # which prints the captured output that the assertion was about, was
          # buried exactly the same way. The premise was wrong: what makes a
          # backtrace affordable is being able to re-run the failure, not the
          # operating system.
          RUST_BACKTRACE: 0
        run: cargo test --workspace --all-features

      - name: Show what Seatbelt refused
        if: always() && matrix.os == 'macos-15'
        run: |
          # A process the sandbox kills dies before `main` and writes nothing
          # to either stream, so the failure carries no reason. The kernel logs
          # one — "Sandbox: sh(123) deny(1) file-read-data /path" — to the
          # unified log and nowhere else.
          #
          # This step exists because two separate rounds of reasoning about
          # which paths dyld needs both looked sound and both changed nothing.
          # The profile printed by the test failures shows `/usr`,
          # `/System/Library` and both cryptex paths granted, and `/bin/sh`
          # still aborts, so the missing rule is not one that can be predicted
          # from reading the profile. Reading it beats guessing at it a third
          # time.
          log show --last 20m --style compact \
            --predicate 'eventMessage CONTAINS "deny("' \
            >"${RUNNER_TEMP}/denials.txt" 2>/dev/null \
            || echo "the unified log is unavailable on this runner"
          echo "denials logged in the window: $(wc -l <"${RUNNER_TEMP}/denials.txt" || echo 0)"

          # Filtered to the processes this job starts. The window is full of
          # `softwareupdated` and `searchpartyd` losing arguments with their
          # own profiles at boot, and taking the first N lines of it returns
          # nothing but that.
          echo "--- refused to a process this job started ---"
          grep -Ei 'Sandbox: (sh|bash|dash|cat|env|python3?|node|go|cc|clang|ld|rustc|cargo|sandbox-exec|nebula[a-z-]*)\(' \
            "${RUNNER_TEMP}/denials.txt" | tail -100 \
            || echo "none: the kernel refused nothing to any process this job started"

      - name: Check that the headless build stands alone
        run: cargo check -p nebula-ide --no-default-features

  docs:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Build the API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read the MSRV from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libwayland-dev pkg-config
      - run: cargo check --workspace --all-features
