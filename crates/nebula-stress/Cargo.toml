[package]
name = "nebula-stress"
description = "End-to-end stress harness: drives a real Nebula editor over a real project and runs the programs in it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nebula-stress"
path = "src/main.rs"

[dependencies]
nebula-core.workspace = true
nebula-exec.workspace = true
nebula-ide = { workspace = true, default-features = false }
nebula-index.workspace = true
nebula-render.workspace = true
nebula-sandbox.workspace = true
nebula-search.workspace = true
nebula-syntax.workspace = true
nebula-ui.workspace = true
nebula-vector.workspace = true
nebula-vfs.workspace = true

anyhow.workspace = true
clap.workspace = true
console.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
